name: Generate Sunny Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: Platane/snk@v3
        with:
          github_user_name: ZRainbow1275
          # 专属轻松配色：浅灰到天空蓝渐变的网格，配上暖橙色贪吃蛇
          outputs: |
            dist/github-snake.svg?color_snake=#F5A623&color_dots=#ebedf0,#bae6fd,#7dd3fc,#38bdf8,#0ea5e9
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
